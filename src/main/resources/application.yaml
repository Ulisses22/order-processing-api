spring:
  # colored terminal output
  output:
    ansi:
      enabled: ALWAYS
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: high-performance-api

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    endpoint:
      # in PROD use "when-authorized"
      health:
        show-details: always

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # I will NOT create tables. I will only verify that they already exist
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  springdoc:
    swagger-ui:
      operations-sorter: method
      tags-sorter: alpha
      display-request-duration: true
    api-docs:
      path: /v3/api-docs

server:
  port: ${SERVER_PORT}

app:
  url: ${APP_URL}
  security:
    username: ${APP_SECURITY_USERNAME}
    password: ${APP_SECURITY_PASSWORD}

security:
  account-lockout:
    max-failed-attempts: ${SECURITY_ACCOUNT_LOCKOUT_MAX_FAILED_ATTEMPTS}
    lock-duration-seconds: ${SECURITY_ACCOUNT_LOCKOUT_LOCK_DURATION_SECONDS}
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:10}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:10}
    refill-duration-seconds: ${RATE_LIMIT_REFILL_DURATION_SECONDS:60}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

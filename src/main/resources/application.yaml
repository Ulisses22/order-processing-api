spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: high-performance-api

  management:
    endpoints:
      web:
        expose:
          include: health,info,metrics,prometheus
    endpoint:
      # in PROD use "when-authorized"
      health:
        show-details: always

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enable: true
    locations: classpath:db/migration
    baseline-om-migrate: true

server:
  port: ${SERVER_PORT}


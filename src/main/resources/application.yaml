spring:
  # colored terminal output
  output:
    ansi:
      enabled: ALWAYS
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: high-performance-api

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    endpoint:
      # in PROD use "when-authorized"
      health:
        show-details: always

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # I will NOT create tables. I will only verify that they already exist
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT}


spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: high-performance-api

  management:
    endpoints:
      web:
        expose:
          include: health,info,metrics,prometheus
    endpoint:
      # in PROD use "when-authorized"
      health:
        show-details: always

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

    properties:
      jakarta.persistence.schema-generation.scripts.action: create
      jakarta.persistence.schema-generation.scripts.create-source: metadata
      jakarta.persistence.schema-generation.scripts.create-target: build/schema-preview.sql

  flyway:
    enabled: true
#    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT}


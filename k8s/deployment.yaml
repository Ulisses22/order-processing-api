apiVersion: apps/v1
kind: Deployment
metadata:
  name: high-performance-api
  labels:
    app: high-performance-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: high-performance-api

  template:
    metadata:
      labels:
        app: high-performance-api

    spec:
      containers:
        - name: high-performance-api
          image: high-performance-api:0.1.0
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: high-performance-api-config

            - secretRef:
                name: high-performance-api-secret

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
